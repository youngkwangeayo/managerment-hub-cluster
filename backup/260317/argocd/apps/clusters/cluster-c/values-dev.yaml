clusterName: cluster-c-dev
# argocd cluster add <context> --name cluster-c 후 나온 API 서버 URL로 교체
destinationServer: https://CLUSTER_C_API_SERVER
targetRevision: main

cascadeDelete: true

syncPolicy:
  automated:
    prune: true
    selfHeal: true

apps: []
