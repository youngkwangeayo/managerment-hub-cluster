apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-setup-app
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: git@bitbucket.org:*******/mgmt-hub-cluster.git
    targetRevision: main
    path: argocd/hub-setup   # 이제 이 경로를 Helm 차트로 인식합니다.
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true