# init-hub-repo-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: repo-mgmt-hub-cluster-init
  namespace: argocd
  labels:
    # Argo CD가 이 시크릿을 'Git 저장소 연결용'으로 인식하게 만드는 필수 라벨
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@bitbucket.org:*******/mgmt-hub-cluster.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ********
    -----END OPENSSH PRIVATE KEY-----